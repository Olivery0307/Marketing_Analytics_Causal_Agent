<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketing Analytics Agent</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #f4f6f9;
      --surface:    #ffffff;
      --surface-2:  #f8f9fb;
      --border:     #e4e8ef;
      --primary:    #2563eb;
      --primary-h:  #1d4ed8;
      --primary-lt: #eff6ff;
      --text:       #0f172a;
      --text-2:     #475569;
      --muted:      #94a3b8;
      --success:    #16a34a;
      --success-lt: #f0fdf4;
      --warn:       #d97706;
      --radius:     12px;
      --radius-sm:  8px;
      --shadow:     0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md:  0 4px 12px rgba(0,0,0,.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 20;
    }
    .header-left { display: flex; align-items: center; gap: .75rem; }
    .logo {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: .85rem; font-weight: 700;
    }
    .header-title { font-size: .93rem; font-weight: 600; color: var(--text); }
    .header-sub   { font-size: .75rem; color: var(--muted); margin-top: 1px; }
    .status-pill {
      display: flex; align-items: center; gap: .4rem;
      font-size: .72rem; font-weight: 500;
      background: var(--success-lt);
      color: var(--success);
      border: 1px solid #bbf7d0;
      padding: .2rem .65rem;
      border-radius: 99px;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
    .new-chat-btn {
      background: none; border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: .3rem .75rem;
      font-size: .78rem; font-weight: 500; color: var(--text-2);
      cursor: pointer; transition: all .15s;
    }
    .new-chat-btn:hover { background: var(--bg); border-color: var(--primary); color: var(--primary); }

    /* ── App body ─────────────────────────────── */
    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ──────────────────────────────── */
    aside {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-section {
      padding: 1rem 1rem .75rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-section:last-child { border-bottom: none; flex: 1; overflow-y: auto; }
    .section-label {
      font-size: .68rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em;
      color: var(--muted); margin-bottom: .65rem;
    }
    .dataset-pill {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .65rem .8rem;
    }
    .dataset-name { font-size: .8rem; font-weight: 600; color: var(--text); margin-bottom: .3rem; }
    .dataset-meta { font-size: .73rem; color: var(--text-2); line-height: 1.5; }
    .dataset-tag {
      display: inline-block; font-size: .65rem; font-weight: 600;
      background: #ede9fe; color: #6d28d9;
      border-radius: 4px; padding: .1rem .35rem; margin-top: .35rem;
    }

    .example-btn {
      display: block; width: 100%;
      text-align: left;
      background: none; border: none;
      padding: .45rem .5rem;
      border-radius: var(--radius-sm);
      font-size: .78rem; color: var(--text-2);
      cursor: pointer; line-height: 1.45;
      transition: background .12s, color .12s;
    }
    .example-btn:hover { background: var(--primary-lt); color: var(--primary); }
    .example-btn::before {
      content: '›';
      margin-right: .4rem;
      color: var(--muted);
      font-weight: 700;
    }
    .example-btn:hover::before { color: var(--primary); }

    /* ── Chat area ────────────────────────────── */
    .chat-area {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    /* Thread */
    .thread {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      scroll-behavior: smooth;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .75rem;
      color: var(--muted);
      padding: 2rem;
      text-align: center;
    }
    .empty-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--primary-lt), #ede9fe);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
    }
    .empty-state h2 { font-size: 1rem; font-weight: 600; color: var(--text-2); }
    .empty-state p  { font-size: .82rem; max-width: 320px; line-height: 1.6; }

    /* Message bubbles */
    .msg { display: flex; flex-direction: column; gap: .75rem; }
    .msg-meta {
      display: flex; align-items: center; gap: .5rem;
      font-size: .72rem; color: var(--muted);
    }
    .msg-avatar {
      width: 22px; height: 22px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: .65rem; font-weight: 700; flex-shrink: 0;
    }
    .msg.user .msg-avatar  { background: #dbeafe; color: var(--primary); }
    .msg.agent .msg-avatar { background: linear-gradient(135deg, var(--primary), #7c3aed); color: white; }

    .msg-bubble {
      border-radius: var(--radius);
      padding: .85rem 1.1rem;
      box-shadow: var(--shadow);
      max-width: 860px;
    }
    .msg.user .msg-bubble {
      background: var(--primary);
      color: white;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
    }
    .msg.agent .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* Pipeline badge inside agent msg */
    .pipeline-badges {
      display: flex; align-items: center; gap: .35rem;
      margin-bottom: .75rem; flex-wrap: wrap;
    }
    .pbadge {
      font-size: .65rem; font-weight: 600;
      padding: .15rem .5rem; border-radius: 99px;
      border: 1px solid transparent;
    }
    .pbadge.done    { background: var(--success-lt); border-color: #bbf7d0; color: var(--success); }
    .pbadge.active  { background: var(--primary-lt); border-color: #bfdbfe; color: var(--primary); animation: badgepulse 1s ease-in-out infinite; }
    .pbadge.pending { background: var(--surface-2);  border-color: var(--border); color: var(--muted); }
    @keyframes badgepulse { 0%,100% { opacity:1; } 50% { opacity:.55; } }

    /* Markdown inside agent bubble */
    .answer-body { font-size: .86rem; line-height: 1.75; color: var(--text); }
    .answer-body h1, .answer-body h2 { font-size: .95rem; font-weight: 700; margin: 1rem 0 .35rem; }
    .answer-body h3 { font-size: .87rem; font-weight: 600; margin: .8rem 0 .3rem; }
    .answer-body p  { margin-bottom: .55rem; }
    .answer-body ul, .answer-body ol { padding-left: 1.3rem; margin-bottom: .55rem; }
    .answer-body li { margin-bottom: .2rem; }
    .answer-body strong { font-weight: 600; }
    .answer-body code {
      background: #f1f5f9; padding: .1em .3em;
      border-radius: 4px; font-size: .8em;
      font-family: ui-monospace, "Cascadia Code", monospace;
    }
    .answer-body pre {
      background: #f8fafc; border: 1px solid var(--border);
      padding: .75rem 1rem; border-radius: var(--radius-sm);
      overflow-x: auto; margin-bottom: .55rem;
    }
    .answer-body pre code { background: none; padding: 0; font-size: .8rem; }
    .answer-body blockquote {
      border-left: 3px solid var(--primary); padding-left: .8rem;
      color: var(--text-2); margin-bottom: .55rem;
    }
    .answer-body hr { border: none; border-top: 1px solid var(--border); margin: .7rem 0; }
    .answer-body table { width: 100%; border-collapse: collapse; font-size: .8rem; margin-bottom: .55rem; }
    .answer-body th { background: var(--surface-2); font-weight: 600; }
    .answer-body th, .answer-body td { padding: .4rem .65rem; border: 1px solid var(--border); }

    /* Charts below agent bubble */
    .msg-charts { display: flex; flex-direction: column; gap: .85rem; }
    .chart-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1rem .75rem;
      box-shadow: var(--shadow);
    }
    .chart-label {
      font-size: .7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); margin-bottom: .5rem;
    }
    .chart-plot { width: 100%; min-height: 340px; }

    /* Typing indicator */
    .typing-msg .msg-bubble {
      padding: .7rem .9rem;
      display: flex; align-items: center; gap: .3rem;
    }
    .dot-pulse span {
      display: inline-block;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot-pulse span:nth-child(2) { animation-delay: .2s; }
    .dot-pulse span:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse {
      0%, 80%, 100% { transform: scale(.8); opacity: .5; }
      40%            { transform: scale(1.1); opacity: 1; }
    }

    /* ── Input bar ────────────────────────────── */
    .input-bar {
      padding: 1rem 1.5rem 1.25rem;
      background: var(--bg);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .input-inner {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      display: flex; align-items: flex-end; gap: .5rem;
      padding: .6rem .6rem .6rem 1rem;
      box-shadow: var(--shadow-md);
      transition: border-color .15s, box-shadow .15s;
    }
    .input-inner:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.1), var(--shadow-md);
    }
    #questionInput {
      flex: 1; border: none; background: none; resize: none;
      font-family: inherit; font-size: .9rem; color: var(--text);
      line-height: 1.55; min-height: 24px; max-height: 140px;
      padding: .25rem 0; overflow-y: auto;
    }
    #questionInput:focus { outline: none; }
    #questionInput::placeholder { color: var(--muted); }
    .send-btn {
      width: 36px; height: 36px; flex-shrink: 0;
      border-radius: 10px; border: none;
      background: var(--primary); color: white;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s, transform .1s;
    }
    .send-btn:hover:not(:disabled) { background: var(--primary-h); }
    .send-btn:active:not(:disabled) { transform: scale(.93); }
    .send-btn:disabled { background: #bfdbfe; cursor: not-allowed; }
    .send-btn svg { width: 16px; height: 16px; }
    .input-hint {
      font-size: .7rem; color: var(--muted);
      margin-top: .45rem; padding-left: .25rem;
    }

    /* ── Scrollbar ────────────────────────────── */
    .thread::-webkit-scrollbar { width: 5px; }
    .thread::-webkit-scrollbar-track { background: transparent; }
    .thread::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* ── Responsive ───────────────────────────── */
    @media (max-width: 680px) {
      .app { grid-template-columns: 1fr; }
      aside { display: none; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="header-left">
    <div class="logo">MA</div>
    <div>
      <div class="header-title">Marketing Analytics Agent</div>
      <div class="header-sub">Causal analysis on GA360 data</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:.75rem">
    <div class="status-pill"><span class="status-dot"></span>Live · BigQuery</div>
    <button class="new-chat-btn" onclick="newChat()">+ New chat</button>
  </div>
</header>

<div class="app">

  <!-- Sidebar -->
  <aside>
    <div class="sidebar-section">
      <div class="section-label">Dataset</div>
      <div class="dataset-pill" id="datasetCard">
        <div class="dataset-meta">Loading…</div>
      </div>
    </div>

    <div class="sidebar-section" style="flex:1;overflow-y:auto">
      <div class="section-label">Example Questions</div>
      <div id="exampleList">
        <button class="example-btn" onclick="setQuestion(this)">Does referral traffic convert significantly better than organic search?</button>
        <button class="example-btn" onclick="setQuestion(this)">How do all traffic channels compare in conversion rate and revenue?</button>
        <button class="example-btn" onclick="setQuestion(this)">Do desktop users convert at a higher rate than mobile users?</button>
        <button class="example-btn" onclick="setQuestion(this)">Does organic search convert better than paid search?</button>
        <button class="example-btn" onclick="setQuestion(this)">Is the difference between social and organic conversion significant?</button>
        <button class="example-btn" onclick="setQuestion(this)">How does mobile revenue compare to desktop revenue?</button>
      </div>
    </div>
  </aside>

  <!-- Chat area -->
  <div class="chat-area">

    <!-- Message thread -->
    <div class="thread" id="thread">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">📊</div>
        <h2>Ask a marketing question</h2>
        <p>I'll query real Google Analytics data, run statistical tests, and give you a data-backed answer.</p>
      </div>
    </div>

    <!-- Input bar -->
    <div class="input-bar">
      <div class="input-inner">
        <textarea
          id="questionInput"
          placeholder="Ask a marketing analytics question…"
          rows="1"
          spellcheck="false"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send (Enter)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter to send · Shift+Enter for new line</div>
    </div>
  </div>

</div>

<script>
  // ── State ──────────────────────────────────────────────────
  let sessionId = null;
  let isLoading = false;

  // ── Auto-resize textarea ───────────────────────────────────
  const textarea = document.getElementById('questionInput');
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 140) + 'px';
  });
  textarea.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── Dataset info ───────────────────────────────────────────
  async function loadDatasets() {
    try {
      const res = await fetch('/datasets');
      const datasets = await res.json();
      if (datasets.length) {
        const d = datasets[0];
        const s = d.start_date, e = d.end_date;
        document.getElementById('datasetCard').innerHTML = `
          <div class="dataset-name">${d.name}</div>
          <div class="dataset-meta">
            ${d.rows} sessions<br>
            ${s.slice(0,4)}/${s.slice(4,6)} – ${e.slice(0,4)}/${e.slice(4,6)}
          </div>
          <span class="dataset-tag">BigQuery Public</span>
        `;
      }
    } catch (_) {}
  }

  // ── Example question ───────────────────────────────────────
  function setQuestion(btn) {
    textarea.value = btn.textContent.trim();
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 140) + 'px';
    textarea.focus();
  }

  // ── New chat ───────────────────────────────────────────────
  function newChat() {
    sessionId = null;
    document.getElementById('thread').innerHTML = `
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">📊</div>
        <h2>Ask a marketing question</h2>
        <p>I'll query real Google Analytics data, run statistical tests, and give you a data-backed answer.</p>
      </div>`;
    textarea.value = '';
    textarea.style.height = 'auto';
    textarea.focus();
  }

  // ── Append a user bubble ───────────────────────────────────
  function appendUser(question) {
    document.getElementById('emptyState')?.remove();
    const thread = document.getElementById('thread');
    const el = document.createElement('div');
    el.className = 'msg user';
    el.innerHTML = `
      <div class="msg-meta">
        <div class="msg-avatar">You</div>
        <span>You</span>
      </div>
      <div class="msg-bubble">${escHtml(question)}</div>`;
    thread.appendChild(el);
    scrollThread();
    return el;
  }

  // ── Append typing indicator with live pipeline steps ─────
  let _pipelineTimer = null;
  const _pipelineSteps = [
    { label: 'Collect',     desc: 'Querying BigQuery…' },
    { label: 'EDA',         desc: 'Running EDA…' },
    { label: 'Hypothesize', desc: 'Testing hypothesis…' },
    { label: 'Visualize',   desc: 'Generating charts…' },
  ];

  function _renderPipelineBadges(activeIdx) {
    return _pipelineSteps.map((s, i) => {
      const cls = i < activeIdx ? 'done' : i === activeIdx ? 'active' : 'pending';
      return `<span class="pbadge ${cls}">${s.label}</span>`;
    }).join('<span style="color:var(--muted);font-size:.7rem">›</span>');
  }

  function appendTyping() {
    const thread = document.getElementById('thread');
    const el = document.createElement('div');
    el.className = 'msg agent typing-msg';
    el.id = 'typingIndicator';
    el.innerHTML = `
      <div class="msg-meta">
        <div class="msg-avatar">AI</div>
        <span id="typingLabel">Agent · Querying BigQuery…</span>
      </div>
      <div class="msg-bubble">
        <div class="pipeline-badges" id="livePipeline">${_renderPipelineBadges(0)}</div>
        <div class="dot-pulse"><span></span><span></span><span></span></div>
      </div>`;
    thread.appendChild(el);
    scrollThread();

    let step = 0;
    _pipelineTimer = setInterval(() => {
      step = Math.min(step + 1, _pipelineSteps.length - 1);
      const lp = document.getElementById('livePipeline');
      const tl = document.getElementById('typingLabel');
      if (lp) lp.innerHTML = _renderPipelineBadges(step);
      if (tl) tl.textContent = `Agent · ${_pipelineSteps[step].desc}`;
    }, 5000);
  }

  // ── Replace typing with real response ─────────────────────
  function replaceTyping(data) {
    clearInterval(_pipelineTimer);
    _pipelineTimer = null;
    document.getElementById('typingIndicator')?.remove();
    const thread = document.getElementById('thread');

    const el = document.createElement('div');
    el.className = 'msg agent';

    const badges = _pipelineSteps
      .map(s => `<span class="pbadge done">${s.label}</span>`)
      .join('<span style="color:var(--muted);font-size:.7rem">›</span>');

    const charts = (data.charts || [])
      .filter(c => c.plotly_json && c.plotly_json !== '{}')
      .map((c, i) => {
        const id = `chart-${Date.now()}-${i}`;
        return `
          <div class="chart-wrap">
            <div class="chart-label">${escHtml(c.title || 'Chart')}</div>
            <div class="chart-plot" id="${id}" data-fig='${escAttr(c.plotly_json)}'></div>
          </div>`;
      }).join('');

    el.innerHTML = `
      <div class="msg-meta">
        <div class="msg-avatar">AI</div>
        <span>Agent</span>
      </div>
      <div class="msg-bubble">
        <div class="pipeline-badges">${badges}</div>
        <div class="answer-body">${marked.parse(data.answer || '')}</div>
      </div>
      ${charts ? `<div class="msg-charts">${charts}</div>` : ''}`;

    thread.appendChild(el);

    // Render Plotly charts after DOM insertion
    el.querySelectorAll('.chart-plot[data-fig]').forEach(div => {
      try {
        const fig = JSON.parse(div.dataset.fig);
        const layout = Object.assign({}, fig.layout, {
          paper_bgcolor: 'white', plot_bgcolor: 'white',
          margin: { l: 10, r: 10, t: 36, b: 36 },
          font: { family: '-apple-system, system-ui, sans-serif', size: 12 },
        });
        Plotly.react(div, fig.data, layout, { responsive: true, displayModeBar: false });
        delete div.dataset.fig;
      } catch (e) {
        div.textContent = 'Chart could not be rendered.';
      }
    });

    scrollThread();
  }

  // ── Append error bubble ────────────────────────────────────
  function appendError(msg) {
    clearInterval(_pipelineTimer);
    _pipelineTimer = null;
    document.getElementById('typingIndicator')?.remove();
    const thread = document.getElementById('thread');
    const el = document.createElement('div');
    el.className = 'msg agent';
    el.innerHTML = `
      <div class="msg-meta">
        <div class="msg-avatar">AI</div><span>Error</span>
      </div>
      <div class="msg-bubble" style="background:#fef2f2;border-color:#fecaca;color:#991b1b">
        <strong>Something went wrong</strong><br>
        <span style="font-size:.82rem">${escHtml(msg)}</span>
      </div>`;
    thread.appendChild(el);
    scrollThread();
  }

  // ── Send message ───────────────────────────────────────────
  async function sendMessage() {
    const question = textarea.value.trim();
    if (!question || isLoading) return;

    isLoading = true;
    textarea.value = '';
    textarea.style.height = 'auto';
    document.getElementById('sendBtn').disabled = true;

    appendUser(question);
    appendTyping();

    try {
      const res = await fetch('/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, session_id: sessionId }),
      });

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Server ${res.status}: ${txt.slice(0, 200)}`);
      }

      const data = await res.json();
      sessionId = data.session_id;
      replaceTyping(data);

    } catch (err) {
      appendError(err.message || 'An unexpected error occurred.');
    } finally {
      isLoading = false;
      document.getElementById('sendBtn').disabled = false;
      textarea.focus();
    }
  }

  // ── Helpers ────────────────────────────────────────────────
  function scrollThread() {
    const t = document.getElementById('thread');
    requestAnimationFrame(() => { t.scrollTop = t.scrollHeight; });
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function escAttr(str) {
    return String(str).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
  }

  // ── Init ───────────────────────────────────────────────────
  loadDatasets();
  textarea.focus();
</script>
</body>
</html>
