steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'build'
  - '-t'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/marketing_analytics_causal_agent/marketing-analytics-causal-agent:$COMMIT_SHA'
  - '.'
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'push'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/marketing_analytics_causal_agent/marketing-analytics-causal-agent:$COMMIT_SHA'
- name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'run'
  - 'deploy'
  - 'marketing-analytics-causal-agent'
  - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/marketing_analytics_causal_agent/marketing-analytics-causal-agent:$COMMIT_SHA'
  - '--region=us-central1'
  - '--allow-unauthenticated'
  - '--port=8080'
  - '--memory=1Gi'
  - '--min-instances=1'
  - '--max-instances=1'
  - '--cpu=1'
  - '--timeout=300'
